openapi: 3.1.0
info:
  title: Ahoden Elite Clean API
  version: 0.4.0
  description: M04 quote-to-booking conversion, capacity reservations, customer history, policy-governed changes, cleaner availability, assignments, and explicit booking/job/payment states.
servers:
  - url: http://127.0.0.1:3000
    description: Local XAMPP development
tags:
  - name: System
  - name: Authentication
  - name: Users
  - name: Catalogue
  - name: Availability
  - name: Policies
  - name: Addresses
  - name: Quotes
  - name: Bookings
  - name: Jobs
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Process liveness
      security: []
      responses:
        '200':
          description: The HTTP process is alive.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Process and database readiness
      security: []
      responses:
        '200':
          description: The API can query its database.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
        '503':
          description: The database is unavailable; no connection details are exposed.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: unavailable
              example:
                status: unavailable
                error:
                  code: DATABASE_UNAVAILABLE
                  message: Database is unavailable.
                requestId: 0199f59e-1111-7000-8000-000000000001
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Register a customer account; role and status fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Customer created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Authenticate; owner/admin receive an MFA challenge before a session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Access token or MFA challenge issued }
        '401': { description: Generic invalid credentials response }
        '429': { description: Rate limited }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Rotate the HttpOnly refresh cookie; requires matching x-csrf-token.
      parameters:
        - in: header
          name: x-csrf-token
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rotated session and short-lived access token }
        '401': { description: 'Invalid, expired, revoked, or reused refresh session' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated user's allowed profile fields.
      responses:
        '200': { description: Current user }
        '401': { description: 'Missing, invalid, disabled, or stale-role token' }
  /api/v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      security: []
      summary: Request a reset with an enumeration-safe response.
      responses:
        '202': { description: Generic accepted response }
  /api/v1/staff/invitations:
    post:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Invite cleaner, manager, or admin; owner only.
      responses:
        '201': { description: Invitation recorded and local delivery adapter called }
        '403': { description: Owner role required }
  /api/v1/users/{id}:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Read self, or any account as owner; cross-customer access is concealed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Allowed user fields }
        '404': { description: Missing or concealed resource }
  /api/v1/services:
    get:
      tags: [Catalogue]
      security: []
      summary: List active services with current indicative GHS pricing.
      responses:
        '200':
          description: Active services; production excludes development-only records.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
    post:
      tags: [Catalogue]
      security: [{ bearerAuth: [] }]
      summary: Create a service; owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '201': { description: Service created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Owner role required }
        '409': { description: Production activation is disabled pending explicit business approval }
  /api/v1/services/{serviceId}:
    patch:
      tags: [Catalogue]
      security: [{ bearerAuth: [] }]
      summary: Change service presentation or status; owner only and audited.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, minLength: 10, maxLength: 1000 }
                status: { type: string, enum: [draft, active, inactive] }
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '204': { description: Service changed and audit event appended }
        '403': { description: Owner role required }
        '404': { description: Service not found }
  /api/v1/services/{serviceId}/price-versions:
    post:
      tags: [Catalogue]
      security: [{ bearerAuth: [] }]
      summary: Append an effective-dated GHS price version; owner only and audited.
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceVersionRequest' }
      responses:
        '201': { description: Immutable price version created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Owner role required; managers cannot change prices }
        '409': { description: Effective range overlaps or production activation is blocked }
  /api/v1/service-zones:
    post:
      tags: [Availability]
      security: [{ bearerAuth: [] }]
      summary: Create an exact-region/locality service zone and assign services; owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceZoneRequest' }
      responses:
        '201': { description: Service zone created }
        '403': { description: Owner role required }
  /api/v1/business-hours:
    post:
      tags: [Availability]
      security: [{ bearerAuth: [] }]
      summary: Append effective-dated Africa/Accra business hours; owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBusinessHoursRequest' }
      responses:
        '201': { description: Business-hour window created }
        '403': { description: Owner role required }
        '409': { description: Window overlaps another effective window }
  /api/v1/capacity-slots:
    post:
      tags: [Availability]
      security: [{ bearerAuth: [] }]
      summary: Create an exact UTC capacity slot; owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCapacitySlotRequest' }
      responses:
        '201': { description: Capacity slot created }
        '403': { description: Owner role required }
  /api/v1/policies:
    post:
      tags: [Policies]
      security: [{ bearerAuth: [] }]
      summary: Append an owner-approved, effective-dated policy version.
      description: Recurring policy accepts only per-occurrence upfront payment with automaticBilling=false; this API does not create a recurring billing engine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePolicyRequest' }
      responses:
        '201': { description: Policy version created }
        '403': { description: Owner role required }
        '409': { description: Effective range overlaps or production activation is blocked }
  /api/v1/addresses:
    get:
      tags: [Addresses]
      security: [{ bearerAuth: [] }]
      summary: List the authenticated customer's own addresses.
      responses:
        '200': { description: Customer-owned addresses }
        '403': { description: Customer role required }
    post:
      tags: [Addresses]
      security: [{ bearerAuth: [] }]
      summary: Create an address owned by the authenticated customer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAddressRequest' }
      responses:
        '201': { description: Address created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Customer role required }
  /api/v1/quotes:
    post:
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      summary: Create an expiring, immutable, server-calculated quote.
      description: Client amount, tax, currency, customer, or zone fields are rejected. Capacity is checked here and reserved transactionally only during booking conversion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteRequest' }
            example:
              serviceId: 40000000-0000-4000-8000-000000000010
              addressId: 40000000-0000-4000-8000-000000000099
              startsAt: '2099-01-02T09:00:00.000Z'
              inputs: { bedrooms: 2 }
      responses:
        '201':
          description: Quote snapshot created; expiresAt uses the configured server TTL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Customer role required }
        '404': { description: Address missing or owned by another customer }
        '409': { description: 'Service, zone, price, policy, business hours, start time, or capacity unavailable' }
  /api/v1/quotes/{quoteId}:
    get:
      tags: [Quotes]
      security: [{ bearerAuth: [] }]
      summary: Read the authenticated customer's quote with derived expiry state.
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Immutable quote snapshot and current expired/bookable flags }
        '404': { description: Missing or cross-customer quote }
  /api/v1/bookings:
    post:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Convert an owned, unexpired quote into one pending-payment booking.
      description: Transactionally locks capacity and persists the idempotency key. M04 never accepts client booking/payment state and never marks payment paid.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
            example: { quoteId: 40000000-0000-4000-8000-000000000099 }
      responses:
        '201':
          description: Booking created, or the original result replayed for the same key and payload.
          headers:
            Idempotency-Replayed:
              description: Present with value true when the original result is replayed.
              schema: { type: string, const: 'true' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Booking' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Missing or cross-customer quote }
        '409': { description: 'Quote expired/already used, idempotency conflict, or capacity unavailable' }
    get:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: List the authenticated customer's booking history.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Customer-owned bookings only.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Booking' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /api/v1/bookings/{bookingId}:
    get:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Read one owned booking; cross-customer access is concealed.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Owned booking.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Booking' } }
        '404': { description: Missing or cross-customer booking }
  /api/v1/bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Cancel an owned unpaid booking within its snapshotted policy window.
      description: Capacity release, booking/job state changes, and audit append occur in one transaction. Paid cancellation is deferred to M05 refund controls.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 255 } }
      responses:
        '200': { description: Cancelled booking and released reservation }
        '404': { description: Missing or cross-customer booking }
        '409': { description: 'Expired/terminal booking, closed policy window, or paid refund workflow required' }
  /api/v1/bookings/{bookingId}/reschedule:
    post:
      tags: [Bookings]
      security: [{ bearerAuth: [] }]
      summary: Atomically move an owned booking to a new owned quote and capacity slot.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId, reason]
              properties:
                quoteId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        '200': { description: Booking moved and reschedule history/audit appended }
        '404': { description: Missing or cross-customer booking/quote }
        '409': { description: 'Policy limit/window, quote, state, or target capacity conflict' }
  /api/v1/cleaners/{cleanerId}/availability:
    post:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Append an availability window for an active cleaner; manager or owner only.
      parameters:
        - in: path
          name: cleanerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCleanerAvailabilityRequest' }
      responses:
        '201': { description: Availability window created and audited }
        '403': { description: Manager or owner role required }
        '404': { description: Active cleaner not found }
        '409': { description: Availability window overlaps existing data }
  /api/v1/jobs/{jobId}/assignments:
    post:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Assign or version-checked reassign available cleaners; manager or owner only.
      description: Pending prepaid jobs return PAYMENT_REQUIRED. M04 has no approved-credit bypass and no API that marks payment paid.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignJobRequest' }
            example: { cleanerIds: [71000000-0000-4000-8000-000000000011] }
      responses:
        '201': { description: Assignment created/replayed or reassignment audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Manager or owner role required }
        '404': { description: Job not found }
        '409': { description: 'Payment, availability, overlap, idempotency, or version conflict' }
  /api/v1/jobs/{jobId}:
    get:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Read a job as manager/owner or as an actively assigned cleaner.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Authorized operational job fields.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Job' } }
        '403': { description: Role is not operational staff }
        '404': { description: Missing job or concealed from an unassigned cleaner }
  /api/v1/jobs/{jobId}/status:
    patch:
      tags: [Jobs]
      security: [{ bearerAuth: [] }]
      summary: Apply one permitted role-specific job transition using the current version.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobTransitionRequest' }
      responses:
        '200': { description: Job transition and audit committed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Missing or concealed job }
        '409': { description: 'Payment, state-transition, or optimistic-version conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  headers:
    RequestId:
      description: Caller-supplied safe request ID or a server-generated UUID.
      schema:
        type: string
  parameters:
    ServiceId:
      in: path
      name: serviceId
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      in: path
      name: bookingId
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Caller-generated key. Reuse is allowed only with the identical authenticated operation and payload.
      schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/Credentials'
        - type: object
          additionalProperties: false
          required: [displayName]
          properties:
            displayName: { type: string, minLength: 2, maxLength: 120 }
    DevelopmentApproval:
      type: object
      required: [developmentOnly]
      properties:
        developmentOnly:
          type: boolean
          description: Must be true for unresolved fixture pricing, tax, zones, hours, capacity, or policy data.
        approvalReference:
          type: string
          minLength: 3
          maxLength: 120
          description: Required when developmentOnly=false, together with the separately enabled production activation gate.
    Service:
      type: object
      required: [id, code, name, description, durationMinutes, developmentOnly, recurrence]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        durationMinutes: { type: integer }
        developmentOnly: { type: boolean }
        recurrence:
          type: object
          description: Scheduling metadata only; automatic billing is always false in M03.
        indicativePrice:
          type: object
          properties:
            currency: { type: string, const: GHS }
            baseAmountMinor: { type: integer }
            taxBasisPoints: { type: integer }
            priceVersion: { type: integer }
            developmentOnly: { type: boolean }
    CreateServiceRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [code, name, description, durationMinutes, status, recurrence]
          properties:
            code: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
            name: { type: string, minLength: 2, maxLength: 120 }
            description: { type: string, minLength: 10, maxLength: 1000 }
            durationMinutes: { type: integer, minimum: 30, maximum: 1440 }
            status: { type: string, enum: [draft, active, inactive] }
            recurrence:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [mode]
                  properties: { mode: { const: one_time } }
                - type: object
                  additionalProperties: false
                  required: [mode, unit, interval]
                  properties:
                    mode: { const: recurring }
                    unit: { type: string, enum: [week, month] }
                    interval: { type: integer, minimum: 1, maximum: 52 }
    CreatePriceVersionRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [baseAmountMinor, includedBedrooms, bedroomSurchargeMinor, taxBasisPoints, effectiveFrom, reason]
          properties:
            baseAmountMinor: { type: integer, minimum: 0, description: GHS pesewas }
            includedBedrooms: { type: integer, minimum: 0, maximum: 20 }
            bedroomSurchargeMinor: { type: integer, minimum: 0, description: GHS pesewas }
            taxBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
            effectiveFrom: { type: string, format: date-time }
            effectiveTo: { type: string, format: date-time }
            reason: { type: string, minLength: 3, maxLength: 255 }
    CreateServiceZoneRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [code, name, region, localities, serviceIds, status]
          properties:
            code: { type: string }
            name: { type: string }
            region: { type: string }
            localities: { type: array, minItems: 1, items: { type: string } }
            serviceIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
            status: { type: string, enum: [active, inactive] }
    CreateBusinessHoursRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [dayOfWeek, opensAt, closesAt, effectiveFrom]
          properties:
            dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: '0=Sunday, interpreted in Africa/Accra' }
            opensAt: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
            closesAt: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
            effectiveFrom: { type: string, format: date }
            effectiveTo: { type: string, format: date }
    CreateCapacitySlotRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [serviceId, startsAt, endsAt, capacityTotal, status]
          properties:
            serviceId: { type: string, format: uuid }
            startsAt: { type: string, format: date-time, description: UTC instant }
            endsAt: { type: string, format: date-time, description: UTC instant }
            capacityTotal: { type: integer, minimum: 1, maximum: 10000 }
            status: { type: string, enum: [active, inactive] }
    CreatePolicyRequest:
      allOf:
        - $ref: '#/components/schemas/DevelopmentApproval'
        - type: object
          additionalProperties: false
          required: [policyType, title, rules, effectiveFrom]
          properties:
            policyType: { type: string, enum: [cancellation, rescheduling, reclean, recurring] }
            title: { type: string, minLength: 3, maxLength: 160 }
            rules: { type: object, description: Strict type-specific rules; recurring requires per_occurrence_upfront and automaticBilling=false. }
            effectiveFrom: { type: string, format: date-time }
            effectiveTo: { type: string, format: date-time }
    CreateAddressRequest:
      type: object
      additionalProperties: false
      required: [label, addressLine1, locality, region]
      properties:
        label: { type: string, maxLength: 80 }
        addressLine1: { type: string, minLength: 5, maxLength: 255 }
        addressLine2: { type: string, maxLength: 255 }
        locality: { type: string, minLength: 2, maxLength: 120 }
        region: { type: string, minLength: 2, maxLength: 120 }
        postalCode: { type: string, maxLength: 30 }
    CreateQuoteRequest:
      type: object
      additionalProperties: false
      required: [serviceId, addressId, startsAt, inputs]
      properties:
        serviceId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        inputs:
          type: object
