        expectedVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 3, maxLength: 255 }
    JobState:
      type: string
      enum: [awaiting_payment, unassigned, assigned, en_route, started, completed, delayed, exception, cancelled]
    Job:
      type: object
      required: [id, bookingId, state, version, startsAt, endsAt, bookingStatus, paymentStatus, cleanerIds]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/JobState' }
