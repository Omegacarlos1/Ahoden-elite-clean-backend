      properties:
        id: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        priceVersionId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        startsAtBusinessTime: { type: string, example: '2099-01-02T09:00:00[Africa/Accra]' }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
        bookable: { type: boolean }
        currency: { type: string, const: GHS }
        subtotalMinor: { type: integer }
        tax:
          type: object
          required: [basisPoints, amountMinor]
          properties:
            basisPoints: { type: integer }
            amountMinor: { type: integer }
        totalMinor: { type: integer }
        inputs: { type: object }
        service: { type: object }
        address: { type: object }
        pricing: { type: object }
        policies: { type: object }
        recurringBillingCreated: { type: boolean, const: false }
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, format: uuid }
    Booking:
      type: object
      required: [id, initialQuoteId, quoteId, status, paymentStatus, startsAt, startsAtBusinessTime, rescheduleCount, reservation, currency, subtotalMinor, tax, totalMinor, service, address, pricing, policies, job, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        initialQuoteId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, confirmed, cancelled, expired, completed] }
        paymentStatus: { type: string, enum: [pending, paid, failed, refunded] }
        startsAt: { type: string, format: date-time }
        startsAtBusinessTime: { type: string, example: '2099-01-02T09:00:00[Africa/Accra]' }
        rescheduleCount: { type: integer, minimum: 0 }
