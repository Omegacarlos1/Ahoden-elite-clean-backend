          type: object
          required: [state, expiresAt]
          properties:
            state: { type: string, enum: [held, released, confirmed, consumed] }
            expiresAt: { type: [string, 'null'], format: date-time }
        currency: { type: string, const: GHS }
        subtotalMinor: { type: integer }
        tax: { type: object }
        totalMinor: { type: integer }
        service: { type: object }
        address: { type: object }
        pricing: { type: object }
        policies: { type: object }
        job:
          type: object
          required: [id, state, version]
          properties:
            id: { type: string, format: uuid }
            state: { $ref: '#/components/schemas/JobState' }
