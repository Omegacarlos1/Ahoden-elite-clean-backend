name: backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ahoden_elite_clean_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3001
      LOG_LEVEL: silent
      DATABASE_URL: mysql://ahoden_test_app@127.0.0.1:3306/ahoden_elite_clean_test
      MIGRATION_DATABASE_URL: mysql://ahoden_test_migrator@127.0.0.1:3306/ahoden_elite_clean_test
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY: 'false'
      BODY_LIMIT: 100kb
      ALLOW_TEST_DATABASE_RESET: 'true'
      TEST_DATABASE_ALLOWED_HOSTS: 127.0.0.1,localhost,mysql
      ACCESS_TOKEN_SECRET: ci-only-access-token-secret-32-bytes-minimum
      MFA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      OWNER_BOOTSTRAP_TOKEN: ci-only-owner-bootstrap-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Create least-privilege test accounts
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -u root <<'SQL'
          SET GLOBAL log_bin_trust_function_creators = 1;
          CREATE USER IF NOT EXISTS 'ahoden_test_migrator'@'%' IDENTIFIED BY '';
          CREATE USER IF NOT EXISTS 'ahoden_test_app'@'%' IDENTIFIED BY '';
          GRANT ALL PRIVILEGES ON ahoden_elite_clean_test.* TO 'ahoden_test_migrator'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON ahoden_elite_clean_test.* TO 'ahoden_test_app'@'%';
          FLUSH PRIVILEGES;
          SQL
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run db:test:reset
      - run: npm run test:integration
      - name: Run local Postman smoke folder
        run: |
          npm start > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/ready > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          npm run test:postman -- --env-var baseUrl=http://127.0.0.1:3001
